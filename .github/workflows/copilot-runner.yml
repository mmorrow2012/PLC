name: Copilot Agent Runner

on:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      model_override:
        description: Optional model override. Leave at auto to use stage/project heuristics.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - gpt-5.4
          - claude-sonnet-4.5
          - claude-opus-4.6
      max_assignments:
        description: Number of ready issues to hand off in this run.
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: copilot-runner
  cancel-in-progress: false

jobs:
  run-agent:
    if: ${{ github.event_name != 'issues' || (contains(github.event.issue.labels.*.name, 'agent:copilot') && contains(github.event.issue.labels.*.name, 'status:ready')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Copilot token
        id: preflight
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "COPILOT_GITHUB_TOKEN is not configured; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run Copilot issue handoff
        if: steps.preflight.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL_OVERRIDE: ${{ github.event.inputs.model_override }}
          COPILOT_MAX_ASSIGNMENTS: ${{ github.event.inputs.max_assignments }}
          COPILOT_BASE_BRANCH: main
        run: node scripts/run-copilot-agent.mjs
