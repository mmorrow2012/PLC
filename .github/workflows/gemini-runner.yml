name: Gemini Agent Runner

on:
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [opened, reopened]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  run-agent:
    if: ${{ github.event_name != 'issues' || (contains(github.event.issue.labels.*.name, 'agent:gemini') && contains(github.event.issue.labels.*.name, 'status:ready')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/run-gemini-agent.mjs
