name: Claude Agent Runner

on:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      model_override:
        description: Optional model override. Leave at auto to use stage/project heuristics.
        required: false
        default: auto
        type: choice
        options:
          - auto
          - claude-sonnet-5
          - claude-opus-5
      max_budget_usd:
        description: Maximum USD Claude Code may spend implementing this issue.
        required: false
        default: "5"
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: claude-runner
  cancel-in-progress: false

jobs:
  run-agent:
    if: ${{ github.event_name != 'issues' || (contains(github.event.issue.labels.*.name, 'agent:claude') && contains(github.event.issue.labels.*.name, 'status:ready')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        run: |
          git config --global user.name "claude[bot]"
          git config --global user.email "41898282+claude[bot]@users.noreply.github.com"

      - name: Check Claude auth
        id: preflight
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is configured; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code
        if: steps.preflight.outputs.ready == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code issue runner
        if: steps.preflight.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_MODEL_OVERRIDE: ${{ github.event.inputs.model_override }}
          CLAUDE_MAX_BUDGET_USD: ${{ github.event.inputs.max_budget_usd }}
        run: node scripts/run-claude-agent.mjs
