name: Build & deploy project demos

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "prompts/manifest.json"
      - "scripts/build-all.mjs"
      - "scripts/build-hub.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build every scaffolded app and assemble the multi-app site
        run: |
          node scripts/build-all.mjs
          node scripts/build-hub.mjs
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
